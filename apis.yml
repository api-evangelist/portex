name: Portex
description: 'Portex is a freight procurement and management platform that replaces the emails,
  spreadsheets, and PDFs of traditional freight quoting with a single collaborative workspace.
  Shippers, brokers, carriers, and forwarders use Portex to create, send, receive, compare, and
  award freight quotes up to 90% faster, centralize shipment documents and tracking, chat with
  carriers, and analyze freight spend for cost-saving recommendations. Founded by Brittany Ennix
  (previously Uber and Flexport) and backed by Cowboy Ventures, Portex is a seed-stage logistics
  technology company. As of this profile the platform is delivered as a hosted web application at
  portexpro.com and does not publish a public developer API, SDKs, or developer portal.'
